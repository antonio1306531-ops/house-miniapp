<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Бронирование дома</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #000000);
      --hint: var(--tg-theme-hint-color, #999999);
      --link: var(--tg-theme-link-color, #2481cc);
      --button: var(--tg-theme-button-color, #2481cc);
      --button-text: var(--tg-theme-button-text-color, #ffffff);
      --secondary: var(--tg-theme-secondary-bg-color, #f1f1f1);
      --destructive: #e53935;
      --success: #43a047;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      padding-bottom: 100px;
      line-height: 1.45;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--hint);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .card {
      background: var(--secondary);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .card h2 {
      font-size: 1.05rem;
      margin-bottom: 12px;
    }

    /* Календарь */
    .cal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .cal-header button {
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--link);
      cursor: pointer;
      padding: 4px 10px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      color: var(--hint);
      margin-bottom: 6px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      transition: 0.15s;
    }

    .day.empty { cursor: default; }
    .day.past { color: var(--hint); opacity: 0.5; cursor: default; }
    .day.busy { background: #ffebee; color: var(--destructive); cursor: default; text-decoration: line-through; }
    .day.free:hover { background: rgba(36, 129, 204, 0.15); }
    .day.selected {
      background: var(--button);
      color: var(--button-text);
      font-weight: 600;
    }
    .day.in-range {
      background: rgba(36, 129, 204, 0.2);
    }
    .day.today { border: 1.5px solid var(--button); }

    .legend {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--hint);
      margin-top: 10px;
    }

    .legend span { display: flex; align-items: center; gap: 4px; }

    /* Баня */
    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
    }

    .toggle-row .info {
      font-size: 0.85rem;
      color: var(--hint);
    }

    .switch {
      position: relative;
      width: 50px;
      height: 28px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #ccc;
      border-radius: 28px;
      transition: 0.2s;
    }

    .slider:before {
      content: "";
      position: absolute;
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background: white;
      border-radius: 50%;
      transition: 0.2s;
    }

    input:checked + .slider { background: var(--button); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Форма */
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--hint);
      margin-bottom: 4px;
      margin-top: 12px;
    }

    input[type="text"], input[type="tel"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--button);
    }

    .summary {
      font-size: 0.95rem;
    }

    .summary div {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .summary .total {
      font-weight: 700;
      font-size: 1.1rem;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(0,0,0,0.08);
    }

    .error {
      color: var(--destructive);
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    /* Главная кнопка управляется Telegram MainButton */
  </style>
</head>
<body>
  <h1 id="houseName">Загородный дом</h1>
  <p class="subtitle">Выберите даты и оформите бронь</p>

  <!-- Календарь -->
  <div class="card">
    <h2>📅 Даты проживания</h2>
    <div class="cal-header">
      <button id="prevMonth">‹</button>
      <span id="monthLabel"></span>
      <button id="nextMonth">›</button>
    </div>
    <div class="weekdays">
      <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
    </div>
    <div class="days" id="daysGrid"></div>
    <div class="legend">
      <span>✅ свободно</span>
      <span>❌ занято</span>
      <span style="opacity:0.6">прошлое</span>
    </div>
  </div>

  <!-- Баня -->
  <div class="card">
    <div class="toggle-row">
      <div>
        <div style="font-weight:600">🛁 Баня</div>
        <div class="info">Работает с 18:00 до 22:00</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="banyaToggle" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Контакты -->
  <div class="card">
    <h2>👤 Ваши данные</h2>
    <label>Имя</label>
    <input type="text" id="userName" placeholder="Как к вам обращаться" />
    <label>Телефон</label>
    <input type="tel" id="userPhone" placeholder="+7 900 123-45-67" />
  </div>

  <!-- Итого -->
  <div class="card summary" id="summaryCard">
    <div><span>Заезд</span><span id="sumCheckIn">—</span></div>
    <div><span>Выезд</span><span id="sumCheckOut">—</span></div>
    <div><span>Ночей</span><span id="sumNights">—</span></div>
    <div><span>Баня</span><span id="sumBanya">нет</span></div>
    <div class="total"><span>Итого</span><span id="sumTotal">—</span></div>
  </div>

  <div class="error" id="errorMsg"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ===== Настройки (можно менять) =====
    const PRICE_PER_NIGHT = 5000;          // цена за ночь
    const HOUSE_NAME = "Загородный дом";   // название

    // Занятые даты (пример). Потом можно передавать из бота.
    // Формат: "YYYY-MM-DD"
    let occupiedDates = new Set([
      // "2026-09-15",
      // "2026-09-16",
    ]);

    // ===== Состояние =====
    let current = new Date();
    current.setDate(1);
    let checkIn = null;
    let checkOut = null;
    let selecting = "check_in"; // check_in | check_out

    const monthsRu = [
      "Январь","Февраль","Март","Апрель","Май","Июнь",
      "Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"
    ];

    // ===== DOM =====
    const daysGrid = document.getElementById("daysGrid");
    const monthLabel = document.getElementById("monthLabel");
    const banyaToggle = document.getElementById("banyaToggle");
    const userName = document.getElementById("userName");
    const userPhone = document.getElementById("userPhone");
    const errorMsg = document.getElementById("errorMsg");

    document.getElementById("houseName").textContent = HOUSE_NAME;

    // ===== Календарь =====
    function renderCalendar() {
      const year = current.getFullYear();
      const month = current.getMonth();
      monthLabel.textContent = `${monthsRu[month]} ${year}`;

      daysGrid.innerHTML = "";

      const firstDay = new Date(year, month, 1);
      let startWeekday = firstDay.getDay(); // 0=вс
      startWeekday = startWeekday === 0 ? 6 : startWeekday - 1; // делаем пн=0

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      today.setHours(0,0,0,0);

      // пустые ячейки
      for (let i = 0; i < startWeekday; i++) {
        const el = document.createElement("div");
        el.className = "day empty";
        daysGrid.appendChild(el);
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(year, month, d);
        date.setHours(0,0,0,0);
        const iso = date.toISOString().slice(0, 10);

        const el = document.createElement("div");
        el.className = "day";
        el.textContent = d;

        const isPast = date < today;
        const isBusy = occupiedDates.has(iso);
        const isToday = date.getTime() === today.getTime();

        if (isPast) {
          el.classList.add("past");
        } else if (isBusy) {
          el.classList.add("busy");
        } else {
          el.classList.add("free");
          el.addEventListener("click", () => onDayClick(date));
        }

        if (isToday) el.classList.add("today");

        // подсветка выбранного диапазона
        if (checkIn && date.getTime() === checkIn.getTime()) {
          el.classList.add("selected");
        }
        if (checkOut && date.getTime() === checkOut.getTime()) {
          el.classList.add("selected");
        }
        if (checkIn && checkOut && date > checkIn && date < checkOut) {
          el.classList.add("in-range");
        }

        daysGrid.appendChild(el);
      }

      updateSummary();
    }

    function onDayClick(date) {
      if (selecting === "check_in" || (checkIn && checkOut)) {
        checkIn = date;
        checkOut = null;
        selecting = "check_out";
      } else {
        if (date <= checkIn) {
          checkIn = date;
          checkOut = null;
        } else {
          // проверяем, нет ли занятых дат в диапазоне
          let ok = true;
          let cur = new Date(checkIn);
          cur.setDate(cur.getDate() + 1);
          while (cur < date) {
            const iso = cur.toISOString().slice(0, 10);
            if (occupiedDates.has(iso)) {
              ok = false;
              break;
            }
            cur.setDate(cur.getDate() + 1);
          }
          if (!ok) {
            showError("В выбранном диапазоне есть занятые даты");
            return;
          }
          checkOut = date;
          selecting = "check_in";
        }
      }
      hideError();
      renderCalendar();
    }

    document.getElementById("prevMonth").onclick = () => {
      current.setMonth(current.getMonth() - 1);
      renderCalendar();
    };
    document.getElementById("nextMonth").onclick = () => {
      current.setMonth(current.getMonth() + 1);
      renderCalendar();
    };

    banyaToggle.onchange = updateSummary;
    userName.oninput = updateMainButton;
    userPhone.oninput = updateMainButton;

    function nightsCount() {
      if (!checkIn || !checkOut) return 0;
      return Math.round((checkOut - checkIn) / (1000 * 60 * 60 * 24));
    }

    function updateSummary() {
      const fmt = d => d ? d.toLocaleDateString("ru-RU") : "—";
      document.getElementById("sumCheckIn").textContent = fmt(checkIn);
      document.getElementById("sumCheckOut").textContent = fmt(checkOut);
      const n = nightsCount();
      document.getElementById("sumNights").textContent = n || "—";
      document.getElementById("sumBanya").textContent = banyaToggle.checked ? "да (18:00–22:00)" : "нет";
      const total = n * PRICE_PER_NIGHT;
      document.getElementById("sumTotal").textContent = n ? `${total.toLocaleString("ru-RU")} ₽` : "—";
      updateMainButton();
    }

    function updateMainButton() {
      const ready = checkIn && checkOut && userName.value.trim().length >= 2 && userPhone.value.trim().length >= 10;
      if (ready) {
        tg.MainButton.setText("Забронировать");
        tg.MainButton.show();
        tg.MainButton.enable();
      } else {
        tg.MainButton.hide();
      }
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = "block";
    }
    function hideError() {
      errorMsg.style.display = "none";
    }

    // ===== Отправка данных в бота =====
    tg.MainButton.onClick(() => {
      const name = userName.value.trim();
      const phone = userPhone.value.trim();

      if (!checkIn || !checkOut) {
        showError("Выберите даты заезда и выезда");
        return;
      }
      if (name.length < 2) {
        showError("Введите имя");
        return;
      }
      if (phone.length < 10) {
        showError("Введите корректный телефон");
        return;
      }

      const payload = {
        check_in: checkIn.toISOString().slice(0, 10),
        check_out: checkOut.toISOString().slice(0, 10),
        nights: nightsCount(),
        total_price: nightsCount() * PRICE_PER_NIGHT,
        banya: banyaToggle.checked,
        name: name,
        phone: phone
      };

      // Отправляем данные боту
      tg.sendData(JSON.stringify(payload));
      // После sendData Mini App обычно закрывается
    });

    // Старт
    renderCalendar();
    updateMainButton();

    // Можно принять данные от бота (занятые даты и т.д.)
    // Если бот передаст initDataUnsafe или через start_param — можно расширить
  </script>
</body>
</html>
